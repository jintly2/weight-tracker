<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>体重记录 · 曲线</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="card-title">📈 体重趋势</div>
    <div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap">
      <button class="btn btn-sm range-btn active" data-days="7">近7天</button>
      <button class="btn btn-sm range-btn" data-days="30">近30天</button>
      <button class="btn btn-sm range-btn" data-days="90">近90天</button>
      <button class="btn btn-sm range-btn" data-days="365">近一年</button>
    </div>
    <canvas id="chartCanvas" style="width:100%;height:240px"></canvas>
    <div style="display:flex;gap:16px;margin-top:10px;font-size:11px;color:var(--text2);flex-wrap:wrap">
      <span><span style="display:inline-block;width:12px;height:3px;background:var(--primary-dark);vertical-align:middle;margin-right:4px"></span>体重</span>
      <span><span style="display:inline-block;width:12px;height:2px;border-top:2px dashed var(--accent);vertical-align:middle;margin-right:4px"></span>目标体重</span>
    </div>
  </div>

  <div class="card">
    <div class="card-title">📊 区间统计</div>
    <div class="stats-grid">
      <div class="stat-box"><div class="v" id="stCurrent">--</div><div class="k">当前体重</div></div>
      <div class="stat-box"><div class="v" id="stMin">--</div><div class="k">最低</div></div>
      <div class="stat-box"><div class="v" id="stMax">--</div><div class="k">最高</div></div>
      <div class="stat-box"><div class="v" id="stAvg">--</div><div class="k">平均</div></div>
      <div class="stat-box"><div class="v" id="stChange">--</div><div class="k">区间变化</div></div>
      <div class="stat-box"><div class="v" id="stDays">--</div><div class="k">打卡天数</div></div>
    </div>
  </div>
</div>

<script src="js/common.js"></script>
<script>
if(!requireAuth()) throw new Error('need auth');
renderTopbar('体重曲线');
renderTabbar('chart');

let rangeDays = 7;
let chartData = [];
let targetWeight = null;

document.querySelectorAll('.range-btn').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('.range-btn').forEach(b=>b.classList.remove('active','btn-primary'));
    btn.classList.add('active','btn-primary');
    rangeDays = parseInt(btn.dataset.days);
    loadData();
  };
});

async function loadData(){
  const end = new Date();
  const start = new Date();
  start.setDate(start.getDate() - rangeDays);
  try{
    const records = await api(`/weights/range?start=${fmtDate(start)}&end=${fmtDate(end)}`);
    // 按日期聚合（取早晚平均，或早间优先）
    const dayMap = {};
    records.forEach(r=>{
      if(!dayMap[r.record_date]) dayMap[r.record_date] = [];
      dayMap[r.record_date].push(parseFloat(r.weight));
    });
    chartData = Object.keys(dayMap).sort().map(d=>({date:d, weight: dayMap[d].reduce((a,b)=>a+b,0)/dayMap[d].length}));
  }catch(e){ chartData = []; }
  // 获取用户目标体重
  try{
    const me = await api('/auth/me');
    targetWeight = me.target_weight ? parseFloat(me.target_weight) : null;
  }catch(e){}
  drawChart();
  updateStats();
}

function drawChart(){
  const canvas = document.getElementById('chartCanvas');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const W = rect.width, H = rect.height;
  ctx.clearRect(0,0,W,H);

  if(!chartData.length){
    ctx.fillStyle = '#94a3b8';
    ctx.font = '13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('暂无数据，去日历页记录体重吧', W/2, H/2);
    return;
  }

  const padL = 44, padR = 12, padT = 16, padB = 28;
  const weights = chartData.map(d=>d.weight);
  if(targetWeight) weights.push(targetWeight);
  let minW = Math.min(...weights), maxW = Math.max(...weights);
  const range = maxW - minW || 1;
  minW -= range * 0.1; maxW += range * 0.1;
  const plotW = W - padL - padR, plotH = H - padT - padB;

  // 网格线
  ctx.strokeStyle = '#f1f5f9';
  ctx.lineWidth = 1;
  ctx.fillStyle = '#94a3b8';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'right';
  for(let i=0;i<=4;i++){
    const y = padT + plotH * i/4;
    const val = maxW - (maxW-minW)*i/4;
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
    ctx.fillText(fmtWeightNum(val), padL-6, y+3);
  }

  // X轴日期
  ctx.textAlign = 'center';
  const n = chartData.length;
  const xStep = Math.max(1, Math.floor(n/6));
  for(let i=0;i<n;i+=xStep){
    const x = padL + (n===1?plotW/2:plotW*i/(n-1));
    const d = new Date(chartData[i].date);
    ctx.fillText(`${d.getMonth()+1}/${d.getDate()}`, x, H-padB+14);
  }

  // 目标线
  if(targetWeight){
    const ty = padT + plotH * (maxW-targetWeight)/(maxW-minW);
    ctx.strokeStyle = '#f97316';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(padL,ty); ctx.lineTo(W-padR,ty); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#f97316';
    ctx.textAlign = 'left';
    ctx.fillText('目标 '+fmtWeightNum(targetWeight), padL+4, ty-4);
  }

  // 折线
  ctx.strokeStyle = '#22c55e';
  ctx.lineWidth = 2.5;
  ctx.lineJoin = 'round';
  ctx.beginPath();
  chartData.forEach((d,i)=>{
    const x = padL + (n===1?plotW/2:plotW*i/(n-1));
    const y = padT + plotH * (maxW-d.weight)/(maxW-minW);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();

  // 渐变填充
  const grad = ctx.createLinearGradient(0,padT,0,H-padB);
  grad.addColorStop(0,'rgba(34,197,94,.25)');
  grad.addColorStop(1,'rgba(34,197,94,0)');
  ctx.fillStyle = grad;
  ctx.lineTo(padL+plotW*(n-1?1:0.5), H-padB);
  ctx.lineTo(padL, H-padB);
  ctx.closePath();
  ctx.fill();

  // 数据点
  ctx.fillStyle = '#22c55e';
  chartData.forEach((d,i)=>{
    const x = padL + (n===1?plotW/2:plotW*i/(n-1));
    const y = padT + plotH * (maxW-d.weight)/(maxW-minW);
    ctx.beginPath(); ctx.arc(x,y,3.5,0,Math.PI*2); ctx.fill();
  });
}

function updateStats(){
  if(!chartData.length){
    ['stCurrent','stMin','stMax','stAvg','stChange','stDays'].forEach(id=>document.getElementById(id).textContent='--');
    return;
  }
  const weights = chartData.map(d=>d.weight);
  const cur = weights[weights.length-1];
  const first = weights[0];
  const min = Math.min(...weights), max = Math.max(...weights);
  const avg = weights.reduce((a,b)=>a+b,0)/weights.length;
  const change = cur - first;
  document.getElementById('stCurrent').textContent = fmtWeight(cur);
  document.getElementById('stMin').textContent = fmtWeightNum(min);
  document.getElementById('stMax').textContent = fmtWeightNum(max);
  document.getElementById('stAvg').textContent = fmtWeightNum(avg);
  const chgEl = document.getElementById('stChange');
  chgEl.textContent = (change>0?'+':'') + fmtWeightNum(Math.abs(change)) + (change>0?'↑':'↓');
  chgEl.className = 'v ' + (change>0?'up':'down');
  document.getElementById('stDays').textContent = chartData.length;
}

window.addEventListener('resize', drawChart);
loadData();
</script>
</body>
</html>
